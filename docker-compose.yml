services:
  db:
    image: mysql:8.0
    container_name: webfusion-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.2-apache
    container_name: webfusion-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - wordpress_data:/var/www/html

  # Contenedor encargado de obtener el contenido desde GitHub y copiarlo a WordPress
  theme-sync:
    image: alpine:3.20
    container_name: webfusion-theme-sync
    depends_on:
      wordpress:
        condition: service_started
    environment:
      GIT_REPO_URL: ${GIT_REPO_URL}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      THEME_SOURCE_PATH: ${THEME_SOURCE_PATH:-src/theme}
      THEME_NAME: ${THEME_NAME:-webfusion-home}
    volumes:
      - wordpress_data:/var/www/html
      - ./scripts/theme-sync.sh:/scripts/theme-sync.sh:ro
    entrypoint: ["sh", "/scripts/theme-sync.sh"]

  wp-cli:
    image: wordpress:cli-php8.2
    container_name: webfusion-wp-cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
    working_dir: /var/www/html

volumes:
  db_data:
  wordpress_data:
